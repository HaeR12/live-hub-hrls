<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Hub - Live Chat</title>

    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
        background: #0b1220;
        color: #e5edf7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #0b1220;
      }

      .chat-toolbar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        background: #111c30;
        border-bottom: 1px solid #263750;
      }

      .chat-toolbar h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      #pinButton {
        padding: 8px 12px;
        border: 1px solid #42658d;
        border-radius: 8px;
        background: #1b3554;
        color: #ffffff;
        cursor: pointer;
        font-size: 12px;
      }

      #pinButton:hover {
        background: #284b73;
      }

      #messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .empty-state {
        margin: auto;
        padding: 24px;
        text-align: center;
        color: #8495ad;
        font-size: 13px;
        line-height: 1.6;
      }

      .chat-message {
        padding: 10px 12px;
        border: 1px solid #243750;
        border-radius: 10px;
        background: #111c30;
        overflow-wrap: anywhere;
      }

      .chat-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .platform-label {
        flex-shrink: 0;
        padding: 3px 6px;
        border-radius: 5px;
        background: #243750;
        color: #a9c9f2;
        font-size: 10px;
        font-weight: 700;
      }

      .platform-tiktok {
        background: #3a2438;
        color: #ffb6df;
      }

      .platform-youtube {
        background: #452326;
        color: #ffb4b4;
      }

      .username {
        min-width: 0;
        font-size: 12px;
        font-weight: 700;
        color: #f1f5fb;
      }

      .chat-body {
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.5;
        color: #d4deeb;
      }

      .chat-footer {
        padding: 8px 12px;
        border-top: 1px solid #263750;
        color: #8495ad;
        font-size: 10px;
        text-align: center;
      }

      #connectionStatus {
        color: #91d8bc;
      }
    </style>
  </head>

  <body>
    <header class="chat-toolbar">
      <h1>Live Chat</h1>
      <button id="pinButton" type="button">Pin di Atas</button>
    </header>

    <main id="messages" aria-live="polite">
      <div id="emptyState" class="empty-state">
        Belum ada pesan masuk.<br />
        Pesan TikTok dan YouTube akan muncul di sini.
      </div>
    </main>

    <footer class="chat-footer">
      <span id="connectionStatus">Menunggu pesan...</span>
    </footer>

    <script>
      const messages = document.getElementById("messages");
      const emptyState = document.getElementById("emptyState");
      const pinButton = document.getElementById("pinButton");
      const connectionStatus = document.getElementById("connectionStatus");

      const platformNames = {
        youtube: "YouTube",
        tiktok: "TikTok",
      };

      const renderedEventIds = new Set();
      const MAX_VISIBLE_MESSAGES = 300;

      function getEventKey(event) {
        return event?.eventId ?? event?.id ?? null;
      }

      function addChat(event) {
        if (!event || event.type !== "CHAT") return;

        const eventKey = getEventKey(event);

        // Mencegah pesan tampil dua kali saat riwayat dimuat
        // bersamaan dengan penerimaan event real-time.
        if (eventKey && renderedEventIds.has(eventKey)) return;

        if (eventKey) renderedEventIds.add(eventKey);

        const data =
          event.data && typeof event.data === "object" ? event.data : {};

        const user =
          data.user && typeof data.user === "object" ? data.user : {};

        const platform = String(event.platform ?? "").toLowerCase();

        const item = document.createElement("article");
        item.className = "chat-message";

        const header = document.createElement("div");
        header.className = "chat-header";

        const source = document.createElement("span");
        source.className = "platform-label";

        if (platform === "tiktok") {
          source.classList.add("platform-tiktok");
        } else if (platform === "youtube") {
          source.classList.add("platform-youtube");
        }

        source.textContent =
          platformNames[platform] ?? (platform || "Platform");

        const username = document.createElement("strong");
        username.className = "username";
        username.textContent = user.name ?? user.username ?? "Pengguna";

        header.append(source, username);

        const body = document.createElement("div");
        body.className = "chat-body";
        body.textContent = String(data.message ?? "");

        item.append(header, body);

        emptyState?.remove();
        messages.appendChild(item);

        while (messages.children.length > MAX_VISIBLE_MESSAGES) {
          messages.firstElementChild?.remove();
        }

        messages.scrollTop = messages.scrollHeight;
      }

      async function loadChatHistory() {
        try {
          const history = await window.liveHub.getChatHistory();

          if (!Array.isArray(history)) {
            throw new Error("Format riwayat chat tidak valid.");
          }

          // Riwayat dari backend sudah dibatasi dan diurutkan.
          for (const event of history) {
            addChat(event);
          }

          connectionStatus.textContent = history.length
            ? `Riwayat dimuat: ${history.length} pesan`
            : "Belum ada riwayat chat";

          messages.scrollTop = messages.scrollHeight;

          console.log(`[CHAT HISTORY] ${history.length} pesan dimuat.`);
        } catch (error) {
          console.error("[CHAT HISTORY] Gagal memuat riwayat:", error);

          connectionStatus.textContent =
            "Riwayat gagal dimuat; menunggu pesan baru";
        }
      }

      if (!window.liveHub) {
        connectionStatus.textContent = "Bridge aplikasi tidak tersedia";
        console.error("[CHAT WINDOW] window.liveHub tidak ditemukan.");
      } else {
        // Daftarkan listener lebih dulu supaya event baru tidak terlewat
        // saat riwayat lama sedang dimuat.
        window.liveHub.onEvent((event) => {
          if (event?.type !== "CHAT") return;

          addChat(event);
          connectionStatus.textContent = "Pesan diterima";
        });

        loadChatHistory();
      }

      async function updatePinButton() {
        try {
          const result = await window.liveHub.getChatPin();

          pinButton.textContent = result.pinned ? "Lepas Pin" : "Pin di Atas";
        } catch (error) {
          console.error("[CHAT WINDOW] Gagal membaca status pin:", error);
        }
      }

      pinButton.addEventListener("click", async () => {
        try {
          const current = await window.liveHub.getChatPin();

          await window.liveHub.setChatPin(!current.pinned);
          await updatePinButton();
        } catch (error) {
          console.error("[CHAT WINDOW] Gagal mengubah status pin:", error);
        }
      });

      updatePinButton();
    </script>
  </body>
</html>
